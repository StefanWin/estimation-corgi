version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Matches minimumReleaseAge in pnpm-workspace.yaml (2.5 days).
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      dependencies:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns:
          - "*"
