version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Covers minimumReleaseAge in pnpm-workspace.yaml (3600 min = 2.5 days).
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    assignees:
      - StefanWin
    ignore:
      # Keep in step with the Node 24 runtime (engines + CI); bump the major
      # together with the runtime.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      # cf and the Vite plugin ship as prereleases, which don't count as
      # minor/patch and would otherwise each get their own PR. Listed first
      # because a dependency goes into the first group it matches.
      cloudflare:
        patterns:
          - cf
          - "@cloudflare/*"
      dependencies:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    assignees:
      - StefanWin
    groups:
      actions:
        patterns:
          - "*"
